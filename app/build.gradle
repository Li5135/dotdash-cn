plugins {
    id 'com.android.application'
}

android {
    namespace 'net.iowaline.dotdash.cn'
    compileSdk 35

    defaultConfig {
        applicationId "net.iowaline.dotdash.cn"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
