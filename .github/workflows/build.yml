name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 仓库内 gradle wrapper 的 distributionUrl 默认指向腾讯云镜像（方便国内用户本地构建）；
      # GitHub 海外 runner 改用官方源更快更稳。
      - name: Use official Gradle distribution URL on CI
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.3-bin.zip|' gradle/wrapper/gradle-wrapper.properties

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: dotdash-cn-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build release APK (unsigned)
        if: startsWith(github.ref, 'refs/tags/')
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload release APK (artifact)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: dotdash-cn-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
