name: Android Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotdash-cn-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 推送 tag（v*）时：自动创建/更新 GitHub Release 并附带 APK。
      # runner 位于 GitHub 海外网络，可避免国内直连 uploads 被改写的问题。
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          TAG=${GITHUB_REF_NAME}
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，上传/更新 APK 资产"
            gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "创建 Release $TAG"
            gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" \
              --title "点点划键盘 $TAG" \
              --notes "自动构建 APK。源码见 https://github.com/$GITHUB_REPOSITORY （GPL-3.0）"
          fi
